version: '3.8'

services:
  # ── Backend API Service ────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: gov-backend-dev
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=development
      - PORT=5000
      - FIREBASE_PROJECT_ID=test-project
      - FIRESTORE_EMULATOR_HOST=firebase-emulator:8080
      - FIREBASE_AUTH_EMULATOR_HOST=firebase-emulator:9099
      - FIREBASE_STORAGE_EMULATOR_HOST=firebase-emulator:9199
      - JWT_ACCESS_SECRET=local-development-secret-key-32-chars-long!
      - JWT_REFRESH_SECRET=local-development-refresh-secret-key-32-chars-long!
      - GEMINI_API_KEY=dummy-gemini-key
      - PINECONE_API_KEY=dummy-pinecone-key
      - PINECONE_INDEX_NAME=dummy-index
      - ENCRYPTION_KEY=64616d656c6f63616c656e6372797074696f6e6b65796c6f63616c6465766b65
    volumes:
      - ./backend/src:/usr/src/app/src
    depends_on:
      - firebase-emulator
    networks:
      - gov-net

  # ── Frontend Web Server ────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: gov-frontend-dev
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - gov-net

  # ── Firebase Local Emulator Suite ──────────────────────────────────────────
  firebase-emulator:
    image: andreysenov/firebase-tools:latest
    container_name: gov-firebase-emulator
    ports:
      - "4000:4000" # Emulator UI
      - "8080:8080" # Firestore
      - "9099:9099" # Auth
      - "9199:9199" # Storage
    volumes:
      - ./firebase:/home/node/firebase
    working_dir: /home/node/firebase
    command: firebase emulators:start --project test-project
    networks:
      - gov-net

networks:
  gov-net:
    driver: bridge
